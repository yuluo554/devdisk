name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke (module form)
        run: python -m devdisk --version

      - name: Smoke (console script)
        run: devdisk --version

      - name: Smoke (selftest)
        run: devdisk selftest

      - name: Smoke (help lists commands)
        shell: bash
        run: |
          devdisk --help > help.txt
          for cmd in scan audit clean undo report selftest; do
            grep -q "$cmd" help.txt
          done

      # M1：数据先行 + 扫描（离线，零网络）
      - name: Data (generate synth tree)
        run: python tools/gen_synth_tree.py --out devdisk-out/synth --seed 20261018

      - name: Data (generator is bit-identical)
        run: python tools/gen_synth_tree.py --out devdisk-out/synth --seed 20261018 --check

      - name: Smoke (scan offline)
        run: python -m devdisk scan devdisk-out/synth --out devdisk-out/scan.json --min-bytes 0

      - name: Bench (scan vs truth, dual gate)
        run: python tools/bench_scan.py --tree devdisk-out/synth

      # M2：安全分级（规则表是数据，引擎零硬编码规则）
      - name: "Bench (grade vs truth: reasons, evidence, caution fallback)"
        run: python tools/bench_grade.py --tree devdisk-out/synth

      - name: Bench (grade, independent reference implementation)
        run: python tools/reference_grade.py --tree devdisk-out/synth --scan devdisk-out/scan.json

      # M3：只读审计（Docker fixture 为验收主路径；`.git` 只做文件系统统计）
      - name: "Smoke (audit offline: fixture + synth .git)"
        run: >
          python -m devdisk audit --root devdisk-out/synth --git
          --docker-fixture data/fixtures/docker_system_df/v24_standard.txt
          --out devdisk-out/audit.json

      - name: Smoke (audit docker missing degrades)
        shell: bash
        run: |
          mkdir -p empty-bin
          PY="$(python -c 'import sys; print(sys.executable)')"
          set +e
          PATH="$PWD/empty-bin" "$PY" -m devdisk audit --docker --out devdisk-out/audit-degraded.json
          code=$?
          set -e
          test "$code" -eq 4

      - name: "Bench (audit: docker fixtures + synth .git)"
        run: python tools/bench_audit.py --tree devdisk-out/synth

      # M4：隔离区清理与撤销（dry-run 默认不写盘；apply+undo 往返；中断恢复）
      - name: Smoke (clean dry-run / apply / undo, offline)
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, os, shutil
          from devdisk import exit_codes
          from devdisk import pipeline

          work = os.path.abspath(os.path.join("devdisk-out", "clean-smoke"))
          if os.path.isdir(work):
              shutil.rmtree(work)
          root = os.path.join(work, "root")
          target = os.path.join(root, "demo-web", "node_modules")
          os.makedirs(os.path.join(target, "pkg"))
          with open(os.path.join(root, "demo-web", "package.json"), "w", encoding="utf-8") as handle:
              handle.write('{"name": "demo-web"}')
          with open(os.path.join(root, "demo-web", "package-lock.json"), "w", encoding="utf-8") as handle:
              handle.write("{}")
          with open(os.path.join(target, "pkg", "index.js"), "wb") as handle:
              handle.write(b"x" * 256)

          scan_path = os.path.join(work, "scan.json")
          code, payload, _ = pipeline.run_scan([root], out=scan_path, min_bytes=0)
          assert code == exit_codes.OK, code

          # 1) dry-run：不写隔离区、不移动。
          code, dry, _ = pipeline.run_clean(from_scan=scan_path, select=[target],
                                            out=os.path.join(work, "dry.json"))
          assert code == exit_codes.OK, code
          assert dry["mode"] == "dry_run"
          assert dry["entries"]
          assert not os.path.lexists(os.path.join(root, ".trash")), "dry-run 创建了隔离区"
          assert os.path.isdir(target), "dry-run 移动了源目录"

          # 2) 未给选择 → 退出码 1（无全选）。
          try:
              pipeline.run_clean(from_scan=scan_path)
          except pipeline.ScanError as exc:
              assert exc.exit_code == exit_codes.REFUSED, exc.exit_code
          else:
              raise AssertionError("未给选择却执行了 clean")

          # 3) apply + undo：撤销后原路径与内容回来。
          code, applied, _ = pipeline.run_clean(
              from_scan=scan_path, select=[target], apply=True, yes=True,
              out=os.path.join(work, "apply.json"))
          assert code == exit_codes.OK, code
          assert not os.path.lexists(target), "apply 后源目录仍在"

          code, undone, _ = pipeline.run_undo(
              applied["batch_id"], trash=applied["trash_root"], yes=True,
              out=os.path.join(work, "undo.json"))
          assert code == exit_codes.OK, code
          assert os.path.isfile(os.path.join(target, "pkg", "index.js")), "undo 未恢复内容"
          print("clean/undo smoke: OK")
          PY

      - name: "Bench (clean/undo roundtrip + interrupt resume)"
        run: python tools/bench_clean.py --tree devdisk-out/synth
